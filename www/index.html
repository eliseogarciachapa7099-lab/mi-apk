#jh,#fb,#wb{display:none}
#ov{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px;z-index:5}
#ov h1{margin:0;font-size:38px;letter-spacing:2px}
#ov p{margin:0;max-width:420px;opacity:.85;line-height:1.5;font-size:15px}
#go{pointer-events:auto;font-size:20px;font-weight:700;padding:14px 38px;border:0;border-radius:10px;background:#e8a200;color:#000}
</style></head><body>

<script>

{const p=tg.attributes.position,c=new Float32Array(p.count*3),k=new THREE.Color();

// arboles y rocas
const TR=[],dm=new THREE.Object3D(),NT=480;
const tkG=new THREE.CylinderGeometry(.18,.3,5,7);tkG.translate(0,2.5,0);

tk.setMatrixAt(k,dm.matrix);lv1.setMatrixAt(k,dm.matrix);lv2.setMatrixAt(k,dm.matrix);TR.push([x,z]);k++}

const NR=160,rk=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1.4),new THREE.MeshStandardMaterial({color:0x77736c,roughness:1,flatShading:true}),NR);
for(let k=0,t=0;k<NR&&t<9000;t++){const x=rnd(-140,140),z=rnd(-140,140),y=H(x,z);if(y<.6)continue;
dm.position.set(x,y,z);dm.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));dm.scale.set(rnd(.5,2),rnd(.4,1.4),rnd(.5,2));dm.updateMatrix();rk.setMatrixAt(k,dm.matrix);k++}

// audio

// jugador
const P={x:0,z:0,y:0,vy:0,yaw:Math.PI,pit:0,hp:100};
let sz=150;while(H(0,sz)<1&&sz>0)sz--;const SX=0,SZ=sz-3;
const W=[{n:'CUCHILLO',cd:.55,dmg:100,rg:2.8},{n:'PISTOLA',cd:.28,dmg:36,rg:90},{n:'RIFLE',cd:.11,dmg:27,rg:160}];
let wi=1,am=[0,60,120],cdT=0,kick=0,swing=0,flash=0,hitT=0,state='menu';
const mat=(c,m)=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:m||0});
const bx=(w,h,d,c,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,m));
const VM=[new THREE.Group(),new THREE.Group(),new THREE.Group()];
{let b=bx(.03,.04,.32,0xcfd3d8,.9);b.position.set(0,0,-.2);let h=bx(.045,.05,.14,0x222);h.position.set(0,-.01,.02);VM[0].add(b,h);VM[0].rotation.set(0,0,.3);
let s=bx(.06,.09,.3,0x222,.6);s.position.z=-.1;let g=bx(.05,.13,.07,0x111);g.position.set(0,-.1,.02);let sl=bx(.05,.04,.16,0x888,.8);sl.position.set(0,.05,-.15);VM[1].add(s,g,sl);
let r=bx(.07,.1,.7,0x2a2a2a,.6);r.position.z=-.25;let st=bx(.06,.12,.25,0x4a3320);st.position.set(0,-.02,.25);let br=bx(.035,.035,.35,0x111,.8);br.position.set(0,.02,-.75);let sc2=bx(.05,.06,.2,0x111);sc2.position.set(0,.09,-.2);let mg=bx(.05,.16,.07,0x111);mg.position.set(0,-.12,-.15);VM[2].add(r,st,br,sc2,mg)}
const vm=new THREE.Group();vm.position.set(.26,-.24,-.5);VM.forEach(g=>{g.traverse(o=>{if(o.isMesh)o.castShadow=false});vm.add(g)});camera.add(vm);

// enemigos
let EN=[],MK=[];const ray=new THREE.Raycaster();

function mkEnemy(x,z){const g=new THREE.Group(),e={g,hp:100,dead:false,fall:0,al:0,cd:rnd(.5,1.5),tg:null,parts:[]};g.rotation.order='YXZ';
const m=(geo,c,x,y,z2,hd)=>{const s=new THREE.Mesh(geo,mat(c));s.position.set(x,y,z2);s.castShadow=true;s.userData={e,hd};g.add(s);e.parts.push(s);return s};
m(new THREE.BoxGeometry(.6,.8,.35),0x5a2a22,0,1.2,0);m(new THREE.SphereGeometry(.18,12,10),0xd8a98a,0,1.78,0,1);
m(new THREE.SphereGeometry(.2,12,8,0,6.3,0,1.5),0x2c3320,0,1.82,0);
const lg=new THREE.BoxGeometry(.2,.8,.22);lg.translate(0,-.4,0);e.l1=m(lg,0x2a2f22,-.15,.8,0);e.l2=m(lg,0x2a2f22,.15,.8,0);
m(new THREE.BoxGeometry(.16,.6,.18),0x5a2a22,-.4,1.2,.1);m(new THREE.BoxGeometry(.16,.6,.18),0x5a2a22,.4,1.2,.1);
m(new THREE.BoxGeometry(.08,.1,.7),0x111111,.3,1.3,.4);
g.position.set(x,H(x,z),z);scene.add(g);return e}
function init(){EN.forEach(e=>scene.remove(e.g));MK.forEach(k=>scene.remove(k));EN=[];MK=[];
for(let i=0,t=0;i<16&&t<9000;t++){const x=rnd(-120,120),z=rnd(-120,120),y=H(x,z);if(y<2||y>12||Math.hypot(x-SX,z-SZ)<60)continue;EN.push(mkEnemy(x,z));i++}
for(let i=0,t=0;i<7&&t<9000;t++){const x=rnd(-110,110),z=rnd(-110,110),y=H(x,z);if(y<1.5||y>11)continue;
const k=bx(.5,.5,.5,0x22cc44);k.position.set(x,y+.6,z);k.castShadow=true;const c=bx(.52,.14,.14,0xffffff);k.add(c);scene.add(k);MK.push(k);i++}
Object.assign(P,{x:SX,z:SZ,vy:0,yaw:Math.PI,pit:0,hp:100});am=[0,60,120];sel(1)}
function hurt(n){P.hp-=n;$('dmg').style.opacity=.9;setTimeout(()=>$('dmg').style.opacity=0,120);snd(120,.2,.25,'square')}
function shoot(){const w=W[wi];if(cdT>0||state!='play')return;if(wi>0&&am[wi]<=0){snd(900,.05,.1,'square');cdT=.3;return}
cdT=w.cd;if(wi>0)am[wi]--;
if(wi==0){swing=1;snd(300,.12,.15,'triangle')}else{kick=wi==2?.05:.09;flash=.05;snd(wi==2?180:260,.18,.3)}
const sp=wi==2?.006:.002;ray.setFromCamera({x:rnd(-sp,sp),y:rnd(-sp,sp)},camera);ray.far=w.rg;
const ps=[];EN.forEach(e=>{if(!e.dead)ps.push(...e.parts)});const h=ray.intersectObjects(ps)[0];if(!h)return;

// entrada
const K={};let fire=false,mv={x:0,y:0};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Digit1')sel(0);if(e.code=='Digit2')sel(1);if(e.code=='Digit3')sel(2);if(e.code=='Space'&&P.vy==0&&state=='play')P.vy=7});

function start(){try{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}init();state='play';$('ov').style.display='none';snd(200,.1,.01);if(!TOUCH&&rd.domElement.requestPointerLock)rd.domElement.requestPointerLock()}

// bucle
